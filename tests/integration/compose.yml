services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 2s
      retries: 30
    ports: ["127.0.0.1:55442:5432"]
    tmpfs: [/var/lib/postgresql/data]
  mail:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:58025:8025"]
  auth:
    image: supabase/gotrue:v2.186.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_EXTERNAL_URL: http://127.0.0.1:59999
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_SITE_URL: http://127.0.0.1:58000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${TEST_DB_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_JWT_SECRET: ${TEST_JWT_SECRET:?}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: ${TEST_AUTOCONFIRM:-false}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: institut@example.test
      GOTRUE_SMTP_SENDER_NAME: Planning
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: 'abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!@#$%^&*()_+-=[]{};''\\:"|<>?,./`~'
    ports: ["127.0.0.1:59999:9999"]
  rest:
    image: postgrest/postgrest:v12.2.12
    environment:
      PGRST_DB_URI: postgres://postgres:${TEST_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${TEST_JWT_SECRET:?}
    ports: ["127.0.0.1:53000:3000"]
