services:
  - type: web
    name: planning-beauty
    runtime: static
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
